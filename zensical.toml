[project]
site_name = "deploy-notifier"
site_url = "https://herogold.github.io/deploy-notifier/"
site_description = "A GitHub Action that notifies your server of a new version over OIDC or HMAC and waits for the deploy to finish."
repo_url = "https://github.com/HEROgold/deploy-notifier"
repo_name = "HEROgold/deploy-notifier"
edit_uri = "edit/main/docs/"
docs_dir = "docs"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Action" = "action.md" },
  { "Verifier" = "verifier.md" },
  { "Examples" = [
    { "Overview" = "examples/index.md" },
    { "systemd and Caddy" = "examples/systemd-caddy.md" },
    { "Container and Traefik" = "examples/container-traefik.md" },
    { "Deploy command for docker compose" = "examples/deploy-compose.md" },
  ] },
  { "Protocol" = "protocol.md" },
  { "How it works" = "how-it-works.md" },
  { "Security" = "security.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Development" = "development.md" },
]

[project.theme]
features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "toc.follow",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
# Example pages include the real files from the repo root (verifier/...), so they can't drift.
pymdownx.snippets = { base_path = ["."], check_paths = true }
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/HEROgold/deploy-notifier"
