# What this scans and why: docs/development.md#trivy
name: trivy

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - verifier/**
      - .github/workflows/trivy.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build the verifier image
        run: docker build -t deploy-verifier:scan verifier

      # Pinned by SHA: docs/development.md#trivy
      - name: Scan for the Security tab
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: deploy-verifier:scan
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-verifier-image

      # Why the docker binaries are skipped: docs/development.md#trivy
      - name: Fail on fixable high or critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: deploy-verifier:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-files: /usr/bin/docker,/usr/libexec/docker/cli-plugins/docker-compose
          skip-setup-trivy: true
